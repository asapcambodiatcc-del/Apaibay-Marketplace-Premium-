# ==============================================================================
# Firebase App Hosting Configuration
# Apaibay Marketplace Premium
# ==============================================================================
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
  - variable: PAYMENT_ENVIRONMENT
    value: sandbox
  - variable: PAYMENT_DEFAULT_PROVIDER
    value: sandbox
